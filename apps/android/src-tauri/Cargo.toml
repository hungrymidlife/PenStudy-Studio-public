[package]
name = "penstudy-pad"
version = "0.1.0"
license = "MIT"
description = "PenStudy Android S Pen pad"
authors = ["PenStudy Studio"]
edition = "2021"

[lib]
name = "penstudy_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = {version = "2", features = []}

[dependencies]
tauri = {version = "2", features = []}

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-penstudy-immersive = { path = "../../../plugins/tauri-plugin-immersive" }
